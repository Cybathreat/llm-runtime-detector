[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-runtime-detector"
version = "1.0.1"
description = "Security tool for detecting LLM runtime vulnerabilities, model loading attacks, and inference-time exploits"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ahmed Chiboub", email = "ahmed.chiboub@cybacrest.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "cryptography>=40.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
llm-runtime-detector = "src.cli:main"

[project.urls]
Homepage = "https://github.com/Cybathreat/llm-runtime-detector"
Issues = "https://github.com/Cybathreat/llm-runtime-detector/issues"
